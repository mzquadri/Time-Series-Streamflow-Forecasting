# Lint configuration only. This repository is an experiment, not a package.
#
# The rule set is pinned rather than left to ruff's defaults, which widen between
# releases. A check that passes locally and fails in CI is worse than no check.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
