<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="940" height="460" fill="#ffffff"/>

  <text x="470" y="34" text-anchor="middle" font-size="21" font-weight="600" fill="#0f172a">Three ways to forecast streamflow</text>
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#64748b">Seasonal naive vs SARIMAX vs gradient-boosted trees on a synthetic 15-year daily series</text>

  <!-- Data -->
  <rect x="24" y="90" width="210" height="120" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="129" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">generate_data.py</text>
  <text x="129" y="134" text-anchor="middle" font-size="11" fill="#166534">15 years daily, 2008&#8211;2022</text>
  <text x="129" y="150" text-anchor="middle" font-size="11" fill="#166534">Precipitation + temperature</text>
  <text x="129" y="166" text-anchor="middle" font-size="11" fill="#166534">Snowmelt + autoregression</text>
  <text x="129" y="190" text-anchor="middle" font-size="10" fill="#4d7c0f">fixed seed, deterministic</text>

  <!-- Features -->
  <rect x="24" y="260" width="210" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="129" y="284" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">Feature engineering</text>
  <text x="129" y="304" text-anchor="middle" font-size="11" fill="#166534">Lags 1/2/3/7/14/30/365 d</text>
  <text x="129" y="320" text-anchor="middle" font-size="11" fill="#166534">Rolling mean+std 7/14/30 d</text>
  <text x="129" y="336" text-anchor="middle" font-size="11" fill="#166534">sin/cos month, day-of-year</text>
  <text x="129" y="352" text-anchor="middle" font-size="11" fill="#166534">7-day cumulative rainfall</text>
  <text x="129" y="376" text-anchor="middle" font-size="10" fill="#4d7c0f">XGBoost branch only</text>

  <!-- Models -->
  <rect x="300" y="90" width="300" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="450" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Seasonal Naive</text>
  <text x="450" y="134" text-anchor="middle" font-size="11" fill="#475569">Same-day-of-year average</text>
  <text x="450" y="154" text-anchor="middle" font-size="10.5" fill="#64748b">sanity baseline</text>

  <rect x="300" y="195" width="300" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="219" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">SARIMAX(1,1,1)(1,1,1,12)</text>
  <text x="450" y="239" text-anchor="middle" font-size="11" fill="#1d4ed8">Classical statistics on monthly means</text>
  <text x="450" y="259" text-anchor="middle" font-size="10.5" fill="#3b82f6">statsmodels</text>

  <rect x="300" y="300" width="300" height="90" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="450" y="324" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">XGBoost</text>
  <text x="450" y="344" text-anchor="middle" font-size="11" fill="#5b21b6">300 trees, depth 6, lr 0.05</text>
  <text x="450" y="360" text-anchor="middle" font-size="11" fill="#5b21b6">on engineered lag features</text>
  <text x="450" y="380" text-anchor="middle" font-size="10.5" fill="#6d28d9">one-step-ahead evaluation</text>

  <!-- Evaluation -->
  <rect x="672" y="170" width="244" height="130" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="794" y="194" text-anchor="middle" font-size="13" font-weight="600" fill="#831843">Evaluation</text>
  <text x="794" y="214" text-anchor="middle" font-size="11" fill="#9d174d">Train: first 13 years</text>
  <text x="794" y="230" text-anchor="middle" font-size="11" fill="#9d174d">Test: last 2 years (730 days)</text>
  <text x="794" y="246" text-anchor="middle" font-size="11" fill="#9d174d">RMSE &#183; MAE &#183; R&#178; &#183; NSE &#183; MAPE</text>
  <text x="794" y="270" text-anchor="middle" font-size="10" fill="#be185d">9 figures + forecast_results.json</text>

  <!-- Arrows -->
  <line x1="129" y1="212" x2="129" y2="256" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="236" y1="150" x2="296" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="236" y1="235" x2="296" y2="235" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="236" y1="325" x2="296" y2="345" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="602" y1="235" x2="668" y2="235" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Metrics strip -->
  <rect x="24" y="406" width="892" height="40" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="48" y="431" font-size="12" font-weight="600" fill="#334155">Test R&#178;:</text>

  <rect x="120" y="410" width="250" height="30" rx="15" fill="#faf5ff"/>
  <text x="245" y="430" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">XGBoost 0.979 &#183; RMSE 3.71</text>

  <rect x="386" y="410" width="220" height="30" rx="15" fill="#eff6ff"/>
  <text x="496" y="430" text-anchor="middle" font-size="12" fill="#1d4ed8">SARIMAX 0.721 &#183; RMSE 13.54</text>

  <rect x="622" y="410" width="240" height="30" rx="15" fill="#f1f5f9"/>
  <text x="742" y="430" text-anchor="middle" font-size="12" fill="#475569">Naive &#8722;11.69 &#183; RMSE 90.30</text>
</svg>
